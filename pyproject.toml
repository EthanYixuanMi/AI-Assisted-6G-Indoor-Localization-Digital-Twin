[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-assisted-6g-localization-twin"
version = "0.1.0"
description = "CPU-only simulation framework for AI-assisted indoor localization."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
  "matplotlib>=3.8,<4",
  "plotly>=5.18,<7",
  "streamlit>=1.32,<2",
  "PyYAML>=6.0,<7",
  "joblib>=1.3,<2",
  "Pillow>=10,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "kaleido>=0.2.1,<2"]

[project.scripts]
localization-twin = "localization_twin.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "slow: tests that execute an end-to-end pipeline",
]
